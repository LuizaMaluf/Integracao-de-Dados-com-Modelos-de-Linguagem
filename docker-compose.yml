# PostgreSQL local para os testes `pg` e para rodar o dbt.
# As bases reais são lidas do PostgreSQL do GovHub (POSTGRES_* no .env).
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-govhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govhub}
      POSTGRES_DB: ${POSTGRES_DB:-govhub}
    ports:
      - "5432:5432"
    volumes:
      - govhub-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-govhub}"]
      interval: 10s
      retries: 5

volumes:
  govhub-pg-data:
