x-airflow-common: &airflow-common
  # Imagem própria (airflow/Dockerfile) com as dependências do lock já instaladas.
  build: ./airflow
  image: govhub-airflow:2.9.2
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    PYTHONPATH: /opt/airflow/src
    # MinIO connection
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    MINIO_BUCKET_BRONZE: ${MINIO_BUCKET_BRONZE:-bronze}
    # DuckDB
    DUCKDB_PATH: /opt/airflow/data/silver.duckdb
    # Anthropic (semantic PDF parser)
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
    # PostgreSQL analítico (dbt + costuras)
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:-govhub}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govhub}
    POSTGRES_DB: ${POSTGRES_DB:-govhub}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/configs:/opt/airflow/configs
    # arquivos das fontes de exemplo (POC local, fora do git: poc/raw_files/)
    - ./poc/raw_files:/opt/airflow/raw_files
    # pacote govhub (ingestion + integration), importável via PYTHONPATH
    - ./src:/opt/airflow/src
    - airflow-logs:/opt/airflow/logs
    - duckdb-data:/opt/airflow/data
    - ./output:/opt/airflow/output
    # projeto dbt montado separado — dbt é independente do Airflow
    - ./dbt:/opt/airflow/dbt
  depends_on:
    airflow-db:
      condition: service_healthy
    minio:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-govhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govhub}
      POSTGRES_DB: ${POSTGRES_DB:-govhub}
    ports:
      - "5432:5432"
    volumes:
      - govhub-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-govhub}"]
      interval: 10s
      retries: 5

  airflow-db:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  # S3 local da Bronze Zone. A MinIO parou de publicar imagens públicas;
  # o RustFS é compatível com a API S3 e com o healthcheck do MinIO.
  minio:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5

volumes:
  postgres-data:
  govhub-pg-data:
  minio-data:
  duckdb-data:
  airflow-logs:
