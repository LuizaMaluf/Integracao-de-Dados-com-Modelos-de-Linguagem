[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "govhub"
version = "0.1.0"
description = "Descoberta de chaves de integração entre bases governamentais com LLM embutido"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.28",
    "pandas>=2.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Leitura de tabelas do PostgreSQL (PostgresLoader, testes `pg`)
postgres = [
    "sqlalchemy",
    "psycopg2-binary",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
govhub = "govhub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --import-mode=importlib"
markers = [
    "pg: precisa de PostgreSQL real (POSTGRES_*); pulado se indisponível",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
