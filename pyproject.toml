[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "govhub"
version = "0.1.0"
description = "Ingestão, transformação e integração semântica de bases governamentais brasileiras"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.28",
    "pandas>=2.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Dependências da camada de ingestão e das costuras (usadas no container do Airflow)
ingestion = [
    "httpx",
    "pdfplumber",
    "camelot-py[cv]",
    "unstructured[pdf]",
    "openpyxl",
    "sqlalchemy",
    "psycopg2-binary",
    "fsspec",
    "s3fs",
    "boto3",
    "duckdb",
    "pyarrow",
    "PyYAML",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
govhub = "govhub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"govhub.integration.store" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "airflow"]
addopts = "-v --tb=short --import-mode=importlib"
markers = [
    "pg: precisa de PostgreSQL real (POSTGRES_*); pulado se indisponível",
    "e2e: fluxo completo registry → Postgres → dbt → integração",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
