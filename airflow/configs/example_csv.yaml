source_name: fgts_operacoes
type: csv
schedule: "@daily"

# Path relative to the mounted volume, or an absolute path inside the container
file_path: /opt/airflow/raw_files/fgts_operacoes.csv

# Columns to keep (leave empty to keep all)
columns:
  - cd_contrato
  - vl_financiamento
  - dt_operacao
  - cd_municipio
  - cd_uf

# Rows to skip at the top (e.g. header commentary lines)
skip_rows: 0

# CSV encoding and separator
encoding: utf-8
separator: ";"

# ── Contrato com as camadas seguintes (costuras A/B — ver ADR 0008) ──
# Nome estável da tabela no Postgres (schema silver). Padrão: source_name
# target_table: fgts_operacoes
# Dataset Airflow publicado após a sincronização. Padrão: silver://<target_table>
# silver_dataset: silver://fgts_operacoes
# Pacotes dbt disparados quando o dataset é atualizado
# dbt_packages:
#   - name: <pacote>
#     select: models/
