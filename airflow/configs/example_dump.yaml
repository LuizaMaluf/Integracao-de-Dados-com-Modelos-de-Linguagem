source_name: gold_financiamentos
type: dump
schedule: "@weekly"

# Supported formats: sql | csv_gz
format: csv_gz
file_path: /opt/airflow/raw_files/gold_financiamentos.csv.gz

# For format: sql — list which tables to extract (leave empty = all)
# For format: csv_gz — ignored (single table per file)
tables:
  - gold_financiamentos_imobiliarios

encoding: utf-8
separator: ","

# ── Contrato com as camadas seguintes (costuras A/B — ver ADR 0008) ──
# Dump: cada tabela extraída vai para silver.<nome_da_tabela>; target_table não se aplica.
# Dataset Airflow publicado após a sincronização. Padrão: silver://<source_name>
# silver_dataset: silver://gold_financiamentos
# Pacotes dbt disparados quando o dataset é atualizado
# dbt_packages:
#   - name: <pacote>
#     select: models/
